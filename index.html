<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web components</title>
	<script src="tooltip.js"></script>
	<script src="confirm-link.js"></script>
	<style>
		div {
			border: 2px solid orange;
		}

		.highlight {
			background-color: #f7d28e;
		}
	</style>
</head>
<body>
	<template id="tooltip-template">
		<slot>Some default</slot><span> (?)</span>
	</template>
	<p><uc-tooltip text="Web components is a set of standards.">
		<span class="highlight">Web components</span>
	</uc-tooltip> are awesome!</p>
	<uc-tooltip></uc-tooltip>
	<div>This does not get the web component styles!</div>
	<a is="uc-confirm-link" href="https://google.com">Google</a>
</body>
</html>
